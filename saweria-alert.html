<!-- SAWERIA CUSTOM ALERT — PEKO -->
<div class="swa-wrap">
  <div class="swa-card">
    <img class="swa-bg" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/refs/heads/main/peko.png" alt="">
    <div class="swa-dim"></div>
    <div class="swa-scan"></div>
    <div class="swa-spark swa-spark-a">✦</div>
    <div class="swa-spark swa-spark-b">✧</div>
    <img class="swa-decor swa-left" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/refs/heads/main/kiri.png" alt="">
    <img class="swa-decor swa-right" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/refs/heads/main/kanan.png" alt="">
    <div class="swa-content">
      <div class="swa-kicker">SAWERIA SUPPORT</div>
      <div class="swa-donator">{donator}</div>
      <div class="swa-amount">{amount}</div>
      <div class="swa-divider"></div>
      <div class="swa-message">{message}</div>
    </div>
  </div>
</div>
