<!-- PEKO ALERT — Sociabuzz field HTML -->
<div class="pek-wrap">
  <div class="pek-card">
    <img class="pek-bg" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/main/peko.png" alt="">
    <div class="pek-dim"></div>
    <div class="pek-vignette"></div>
    <div class="pek-scan"></div>
    <div class="pek-bolt pek-bolt-a"></div>
    <div class="pek-bolt pek-bolt-b"></div>
    <div class="pek-star pek-star-a">✦</div>
    <div class="pek-star pek-star-b">✧</div>
    <img class="pek-decor pek-left" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/main/kiri.png" alt="">
    <img class="pek-decor pek-right" src="https://raw.githubusercontent.com/MasAjie12/peko-alert-assets/main/kanan.png" alt="">
    <div class="pek-content">
      <div class="pek-kicker">NEW SUPPORT</div>
      <div class="pek-amount">{amount}</div>
      <div class="pek-from">{from_text}</div>
      <div class="pek-supporter">{supporter}</div>
      <div class="pek-divider"></div>
      <div class="pek-message">{message}</div>
    </div>
  </div>
</div>
